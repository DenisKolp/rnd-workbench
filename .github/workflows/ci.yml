name: RnD Workbench CI

on:
  push:
    branches:
      - main
      - "intermediate-*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: rnd-workbench-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-desktop-contracts:
    name: Python and desktop contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install cross-platform test dependencies
        run: >-
          python -m pip install
          "numpy==2.2.6"
          "pytest>=8.3,<9"
          "sounddevice>=0.5.1,<1"
          "soundfile>=0.13.1,<1"
      - name: Run Python and UI contract tests
        env:
          PYTHONPATH: src
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse Electron sources
        run: |
          node --check windows/electron/main.js
          node --check windows/electron/preload.js
          node --check windows/electron/renderer/app.js

  java-core:
    name: Java 21 core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: Compile and test core
        run: gradle --no-daemon clean test installDist
      - name: Verify Python to Java IPC golden contract
        env:
          PYTHONPATH: ../src
        run: >-
          python ../scripts/verify_java_core_bridge.py
          --java "$JAVA_HOME/bin/java"
          --lib-dir build/install/rnd-workbench-core/lib
          --journal "$RUNNER_TEMP/rnd-workbench-java-bridge.sqlite3"

  macos-java-policy-bundle:
    name: macOS Swift and Java policy boundary
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: Parse Swift shell and run macOS source contracts
        run: |
          python -m pip install "pytest>=8.3,<9"
          swiftc -parse macos/VoiceAssistantApp.swift
          PYTHONPATH=src python -m pytest tests/test_macos_contract.py tests/test_java_core_bridge.py
      - name: Build bounded Java policy runtime
        run: |
          gradle --no-daemon -p core-java clean test installDist
          mkdir -p "$RUNNER_TEMP/java-core"
          cp -R core-java/build/install/rnd-workbench-core/lib "$RUNNER_TEMP/java-core/lib"
          jlink \
            --add-modules "java.base,java.desktop,java.instrument,java.logging,java.management,java.naming,java.net.http,java.security.jgss,java.sql,java.transaction.xa,java.xml,jdk.crypto.ec,jdk.unsupported" \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=zip-6 \
            --output "$RUNNER_TEMP/java-core/runtime"
      - name: Verify macOS bundled-style public external policy contract
        env:
          PYTHONPATH: src
        run: >-
          python scripts/verify_java_core_bridge.py
          --java "$RUNNER_TEMP/java-core/runtime/bin/java"
          --lib-dir "$RUNNER_TEMP/java-core/lib"
          --journal "$RUNNER_TEMP/rnd-workbench-macos-java-bridge.sqlite3"
          --external-models-enabled

  windows-portable-source-build:
    name: Windows Electron voice-ready portable build
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: Install Windows build and contract dependencies
        shell: pwsh
        run: |
          python -m pip install -r windows/requirements-voice.txt
          python -m pip install "pytest>=8.3,<9" "sounddevice>=0.5.1,<1" "soundfile>=0.13.1,<1"
      - name: Run Windows-specific contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD "src"
          python -m pytest tests/test_windows_backend.py tests/test_windows_electron_contract.py tests/test_synapse_package.py tests/test_integrations.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: windows/electron/package-lock.json
      - name: Build portable voice-ready package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File windows/build.ps1 -Python python -WithVoice
      - name: Smoke-test packaged backend and bundled voice dependencies
        shell: pwsh
        run: |
          $dataPath = Join-Path $env:RUNNER_TEMP "rnd-workbench-smoke.sqlite3"
          $env:RND_WORKBENCH_JAVA_CORE_JAVA = Join-Path $PWD "windows/dist/java-core/runtime/bin/java.exe"
          $env:RND_WORKBENCH_JAVA_CORE_LIB_DIR = Join-Path $PWD "windows/dist/java-core/lib"
          $output = @(
            '{"command":"voice_dependency_probe"}'
            '{"command":"core_policy_probe"}'
            '{"command":"quit"}'
          ) | & windows/dist/backend/rnd-workbench-backend.exe --data $dataPath
          if ($LASTEXITCODE -ne 0) { throw "Packaged backend smoke-test failed." }
          $probe = $output |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.type -eq "diagnostic" -and $_.check -eq "runtime_dependencies" } |
            Select-Object -Last 1
          Write-Host ("Voice dependency probe: " + ($probe | ConvertTo-Json -Compress))
          if ($null -eq $probe -or -not $probe.ready) {
            throw "Packaged Faster-Whisper dependencies are unavailable."
          }
          $coreProbe = $output |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.type -eq "diagnostic" -and $_.check -eq "route_policy" } |
            Select-Object -Last 1
          Write-Host ("Java core policy probe: " + ($coreProbe | ConvertTo-Json -Compress))
          if ($null -eq $coreProbe -or -not $coreProbe.ready -or $coreProbe.route -ne "LOCAL") {
            throw "Packaged Java core route policy is unavailable."
          }
      - name: Upload unsigned QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RnD-Workbench-Windows-voice-ready-unsigned-QA
          path: windows/dist/electron/*.exe
          if-no-files-found: error
          retention-days: 7
